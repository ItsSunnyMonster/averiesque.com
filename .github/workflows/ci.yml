name: CI
on:
  push:
    branches: [astro-rewrite]
  pull_request:
    branches: [astro-rewrite]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run astro check
